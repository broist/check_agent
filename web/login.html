{{define "login"}}
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitorozo login</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="login"><main class="login-card"><h1>Monitorozo</h1>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<form method="post" action="/login"><label>Password<input type="password" name="password"
autocomplete="current-password" required autofocus></label><button type="submit">Sign in</button></form>
</main></body></html>
{{end}}
