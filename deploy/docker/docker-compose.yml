services:
  server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./server.yaml:/etc/monitorozo/server.yaml:ro
      - monitorozo-data:/var/lib/monitorozo-server
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  monitorozo-data:

