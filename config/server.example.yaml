# Copy to /etc/monitorozo/server.yaml (0640, root:monitorozo-server).
listen: 127.0.0.1:8080
database_path: /var/lib/monitorozo-server/monitorozo.db
public_url: https://monitor.example.com/
secure_cookies: true
session_idle_timeout: 30m
session_max_lifetime: 12h
max_clock_skew: 2m
max_report_age: 24h
cpu_alert_threshold: 90
memory_alert_threshold: 90
high_usage_duration: 5m
disk_warning_threshold: 85
disk_critical_threshold: 95
agent_offline_after: 120s
alert_cooldown: 30m
http_failure_count: 3
tls_warning_days: 14
tls_critical_days: 3
trusted_proxy: 127.0.0.0/8
raw_retention: 168h
aggregate_retention: 2160h
maintenance_interval: 1h

# Generate with: monitorozo-server hash-token RANDOM_TOKEN
agent_tokens:
  - agent_id: web-01
    hash: "$argon2id$replace-with-generated-hash"
  # During rotation, add the new hash for the same agent, restart the server,
  # switch the agent token, then remove the old hash and restart again.
  # - agent_id: web-01
  #   hash: "$argon2id$replace-with-second-generated-hash"

# Prefer MONITOROZO_ADMIN_PASSWORD_HASH and MONITOROZO_SESSION_SECRET.
admin_password_hash: "$2a$12$replace-with-generated-bcrypt-hash"
session_secret: replace-with-at-least-32-random-characters

smtp:
  enabled: false
  address: email-smtp.eu-central-1.amazonaws.com:587
  username: ""
  # Prefer MONITOROZO_SMTP_PASSWORD.
  password: ""
  from: alerts@example.com
  to: operator@example.com
