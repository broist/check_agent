# Copy to /etc/monitorozo/agent.yaml (0640, root:monitorozo-agent).
agent_id: web-01
server_url: https://monitor.example.com
# Prefer MONITOROZO_AGENT_TOKEN from a protected EnvironmentFile.
token: replace-with-a-random-token-of-at-least-32-characters
interval: 10s
request_timeout: 5s
queue_size: 60
state_file: /var/lib/monitorozo-agent/sequence
insecure_dev_http: false

