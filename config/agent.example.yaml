# Copy to /etc/monitorozo/agent.yaml (0640, root:monitorozo-agent).
agent_id: web-01
server_url: https://monitor.example.com
# Prefer MONITOROZO_AGENT_TOKEN from a protected EnvironmentFile.
token: replace-with-a-random-token-of-at-least-32-characters
interval: 10s
request_timeout: 5s
queue_size: 60
state_file: /var/lib/monitorozo-agent/sequence
spool_directory: /var/lib/monitorozo-agent/spool
# Native defaults. The Compose agent profile overrides these for host views.
proc_root: /proc
sys_root: /sys
host_root: /
mountinfo_path: /proc/self/mountinfo
insecure_dev_http: false

# Optional checks. Omit any section you do not need.
systemd_services:
  - nginx.service
  - my-app.service
docker:
  enabled: false
  socket: /var/run/docker.sock
  timeout: 3s
http_checks:
  - name: public-site
    url: https://example.com/health
    timeout: 3s
tcp_checks:
  - name: local-postgresql
    address: 127.0.0.1:5432
    timeout: 3s

# Package updates (opt-in): apt-check runs hourly in the background; the reboot
# state comes from /run/reboot-required. Needs update-notifier-common on Ubuntu.
packages:
  enabled: true
  interval: 1h
  command: /usr/lib/update-notifier/apt-check
# Container CVE summary written daily by monitorozo-cvescan (root timer).
# Leave the path empty to disable. The agent needs no Docker socket access.
vulnerability_report:
  path: /var/lib/monitorozo-cvescan/summary.json
